<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Campus Waste Study{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #1a7a4a;
      --green-light: #d4edda;
      --green-mid: #2ea86b;
      --blue: #1e40af;
      --amber: #d97706;
      --red: #dc2626;
      --purple: #7c3aed;
      --dark: #0f1923;
      --dark2: #162030;
      --card: #1c2b3a;
      --text: #e8f0e9;
      --muted: #8aab93;
      --border: #2a3f50;
      --accent: #2fe89a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
    }
    nav {
      background: var(--dark2);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-brand span { color: var(--text); font-weight: 400; font-size: 0.9rem; }
    .nav-links { display: flex; gap: 0.25rem; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { background: rgba(47,232,154,0.1); color: var(--accent); }
    main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
    .btn {
      display: inline-block;
      padding: 0.7rem 1.6rem;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: var(--dark); }
    .btn-primary:hover { background: #1fd880; transform: translateY(-1px); }
    .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-outline:hover { background: rgba(47,232,154,0.1); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
    }
    footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
      margin-top: 4rem;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<nav>
  <a class="nav-brand" href="/">🌿 <span>Campus Waste Study</span></a>
  <div class="nav-links">
    <a href="/" {% if request.endpoint == 'index' %}class="active"{% endif %}>Home</a>
    <a href="/survey" {% if request.endpoint == 'survey' %}class="active"{% endif %}>Survey</a>
    <a href="/classifier" {% if request.endpoint == 'classifier' %}class="active"{% endif %}>Classifier</a>
    <a href="/dashboard" {% if request.endpoint == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
  </div>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer>Campus Waste Segregation Behavior Study &mdash; Statistical Data Science Project</footer>
</body>
</html>
